<!doctype html>
<html lang="ko">
<head><script>if(location.protocol==='file:'){location.replace('http://localhost:4173/'+location.search+location.hash);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="키워드 하나에서 시작하는 이미지와 읽을거리. 한 화면을 채우는 새로운 영감."><title>Ideation Guy — 아이디어 뽑기</title><link rel="stylesheet" href="style.css?v=flashlight-1"><link rel="stylesheet" href="dark.css?v=1"><script src="runtime-config.js?v=collector-1"></script><script type="module" src="app.js?v=flashlight-2"></script></head>
<body class="dark-ui landing intro-playing">

<section id="guyIntro" aria-label="Ideation Guy 인트로" tabindex="-1"><canvas id="introCanvas" aria-hidden="true"></canvas><button id="skipIntro" type="button">건너뛰기 ↗</button></section>
<main class="workspace"><aside class="controls">
<h1 class="guy-brand">Ideation Guy<span class="guy-brand-dot" aria-hidden="true">.</span></h1>

<section id="drawStage" class="draw-stage" aria-label="아이디어 전구"><div><canvas id="drawCanvas" width="480" height="480" aria-hidden="true"></canvas><h2 id="drawHeading" hidden></h2><p id="drawMessage" hidden role="status" aria-live="polite"></p></div></section>

<section class="search-area" aria-label="레퍼런스 검색"><form id="searchForm"><label for="keyword" class="sr-only">검색 키워드</label><input id="keyword" name="keyword" placeholder="어떤 영감이 필요한가요?" maxlength="100" autocomplete="off" required><button type="submit" id="searchButton">아이디어 뽑기</button></form></section><label for="contentMode" class="sr-only">아이디어 종류</label><select id="contentMode" hidden><option value="images">이미지</option><option value="mixed" selected>이미지 + 읽을거리</option></select><nav class="idea-actions" aria-label="아이디어 도구">
<button id="shuffle" class="shuffle">↻ <span>새 아이디어 뽑기</span></button>
<section id="ideaSpace" hidden><button id="connect" class="connect">두 장 연결해보기 ↗</button></section>
<button id="savedToggle" class="saved-toggle" hidden>모아둔 것 <span id="savedCount">0</span></button>
<button id="flashlightToggle" type="button" role="switch" aria-checked="true" aria-describedby="flashlightHelp"><span aria-hidden="true">◉</span><span>영감 손전등</span><span id="flashlightValue">ON</span></button><p id="flashlightHelp" class="flashlight-help">잠깐 보고, 빛으로 찾아보세요.</p><button id="boardToggle">무드보드 · 브레인스토밍 ↗</button></nav><aside class="source-note" hidden><a id="cosmosSearch" class="cosmos-search" href="https://www.cosmos.so/" target="_blank" rel="noopener noreferrer">Cosmos에서 같은 키워드 보기 ↗</a><p><span id="providerLabel">Wikimedia Commons · 추첨 미리보기</span><br><a href="https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia" target="_blank" rel="noopener noreferrer">작가 · 이용 조건 확인 ↗</a></p></aside></aside>
<section class="results" aria-label="검색 결과" hidden><div class="result-bar" hidden><div><span id="resultLabel" hidden></span><h2 id="resultTitle">빈티지 포스터 <span>· 10가지</span></h2></div></div><p id="status" hidden role="status" aria-live="polite"></p><section class="idea-space" aria-label="연결한 아이디어"><div id="pairPanel" hidden>
<div><div id="pairImages" class="pair-images"></div><p id="pairSelectionStatus" role="status" aria-live="polite"></p></div>
<div class="idea-prompts"><form id="combineForm">
<details class="optional-features"><summary>특징 직접 더하기</summary><label for="featureA">첫 아이디어 특징 · 선택</label><input id="featureA" placeholder="비워두면 카드에서 연결" maxlength="120">
<label for="featureB">두 번째 아이디어 특징 · 선택</label><input id="featureB" placeholder="비워두면 카드에서 연결" maxlength="120"></details>
<button type="submit">두 아이디어 확장하기</button>
</form><div id="combinationResult" hidden><div id="expansionKeywords" class="expansion-keywords" aria-label="확장 키워드"></div><label for="ideaResult">연결한 아이디어</label><textarea id="ideaResult" rows="5" maxlength="2000"></textarea><button id="saveConnection" type="button">아이디어 모아두기 +</button><p id="connectionStatus" role="status" aria-live="polite"></p></div></div>
</div></section><p id="readingNotice" hidden role="status"></p><div id="grid" class="grid viewport-wall" aria-busy="false"></div><div id="empty" class="empty" hidden></div>

</section>

</main>

<dialog id="detail"><button class="close" id="closeDetail" aria-label="상세 보기 닫기">×</button><div id="detailBody"></div></dialog>
<dialog id="boardDialog" aria-label="무드보드와 브레인스토밍"><div class="board-toolbar"><button id="closeBoard" aria-label="무드보드 닫기">← 돌아가기</button><button id="addBoardNote">메모 추가 +</button><button id="arrangeBoard">정렬하기</button><button id="connectBoard" aria-pressed="false">화살표 연결 →</button><button id="deleteBoardArrow" disabled>선택 연결 삭제</button><span id="boardStatus" role="status"></span></div><div id="boardViewport"><div id="boardSurface"></div><p id="boardEmpty">아이디어를 모아두면 이곳에 펼쳐집니다.</p></div></dialog><a href="privacy.html" class="privacy-link">개인정보처리방침</a><a href="concepts.html" class="concept-link">시안 비교 ↗</a><a href="connections.html" class="connections-link">연결 현황 ↗</a></body></html>
