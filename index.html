<!doctype html>
<html lang="ko">
<head><script>if(location.protocol==='file:'){location.replace('http://localhost:4173/'+location.search+location.hash);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="키워드 하나에서 시작하는 이미지와 읽을거리. 한 화면을 채우는 새로운 영감."><title>Ideation Guy — 아이디어 뽑기</title><link rel="stylesheet" href="style.css?v=flashlight-1"><link rel="stylesheet" href="dark.css?v=connect-4"><link rel="stylesheet" href="motion.css?v=2"><script src="runtime-config.js?v=collector-1"></script><script type="module" src="app.js?v=connect-4"></script></head>
<body class="dark-ui landing intro-playing">

<section id="guyIntro" aria-label="Ideation Guy 인트로" tabindex="-1"><canvas id="introCanvas" aria-hidden="true"></canvas><button id="skipIntro" type="button">건너뛰기 ↗</button></section>
<main class="workspace"><aside class="controls">
<h1 class="guy-brand">Ideation Guy<span class="guy-brand-dot" aria-hidden="true">.</span></h1>

<section id="drawStage" class="draw-stage" aria-label="아이디어 전구"><div><canvas id="drawCanvas" width="480" height="480" aria-hidden="true"></canvas><h2 id="drawHeading" hidden></h2><p id="drawMessage" hidden role="status" aria-live="polite"></p></div></section>

<section class="search-area" aria-label="레퍼런스 검색"><form id="searchForm"><label for="keyword" class="sr-only">검색 키워드</label><input id="keyword" name="keyword" placeholder="어떤 영감이 필요한가요?" maxlength="100" autocomplete="off" required><button type="submit" id="searchButton">아이디어 뽑기</button></form><button id="koreanSourcesToggle" type="button" class="korean-sources-link">한국어 자료 찾기</button></section><label for="contentMode" class="sr-only">아이디어 종류</label><select id="contentMode" hidden><option value="images">이미지</option><option value="mixed" selected>이미지 + 읽을거리</option></select><nav class="idea-actions" aria-label="아이디어 도구">
<div class="tool-group" role="group" aria-label="아이디어 탐색"><button id="shuffle" class="shuffle"><span>새 아이디어 뽑기</span><span class="tool-icon" aria-hidden="true">↻</span></button>
<button id="historyToggle" type="button"><span>지난 결과</span><span id="historyCount" class="tool-end">0</span></button>
<section id="ideaSpace" hidden><button id="connect" class="connect"><span id="connectLabel">연결하기</span><span id="connectIcon" class="tool-icon" aria-hidden="true">↗</span></button></section>
</div><div class="tool-group" role="group" aria-label="수집과 브레인스토밍"><button id="savedToggle" class="saved-toggle" hidden><span id="savedLabel">모아둔 것</span><span id="savedCount" class="tool-end">0</span></button>
<button id="boardToggle"><span>무드보드 · 브레인스토밍</span></button></div><div class="tool-group tool-light" role="group" aria-label="영감 손전등">
<button id="flashlightToggle" type="button" role="switch" aria-checked="true"><span>영감 손전등</span><span id="flashlightValue" class="tool-end">ON</span></button></div></nav><aside class="source-note" hidden><a id="cosmosSearch" class="cosmos-search" href="https://www.cosmos.so/" target="_blank" rel="noopener noreferrer">Cosmos에서 같은 키워드 보기 ↗</a><p><span id="providerLabel">Wikimedia Commons · 추첨 미리보기</span><br><a href="https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia" target="_blank" rel="noopener noreferrer">작가 · 이용 조건 확인 ↗</a></p></aside></aside>
<section class="results" aria-label="검색 결과" hidden><div class="result-bar" hidden><div><span id="resultLabel" hidden></span><h2 id="resultTitle">빈티지 포스터 <span>· 10가지</span></h2></div></div><p id="status" hidden role="status" aria-live="polite"></p><section class="idea-space" aria-label="연결한 아이디어"><div id="pairPanel" hidden>
<div><div id="pairImages" class="pair-images"></div><p id="pairSelectionStatus" role="status" aria-live="polite"></p></div>
<div class="idea-prompts"><form id="combineForm">
<details class="optional-features"><summary>특징 직접 더하기</summary><label for="featureA">1번 자료 특징 · 선택</label><input id="featureA" placeholder="비워두면 카드에서 연결" maxlength="120">
<label for="featureB">2번 자료 특징 · 선택</label><input id="featureB" placeholder="비워두면 카드에서 연결" maxlength="120"><label for="featureC">3번 자료 특징 · 선택</label><input id="featureC" placeholder="가져올 특징을 직접 입력" maxlength="120">
<label for="featureD">4번 자료 특징 · 선택</label><input id="featureD" placeholder="가져올 특징을 직접 입력" maxlength="120"></details>
<button type="submit">아이디어 믹스 만들기</button>
</form></div>
</div></section><p id="readingNotice" hidden role="status"></p><div id="grid" class="grid viewport-wall" aria-busy="false"></div><div id="empty" class="empty" hidden></div>

</section>

</main>

<dialog id="historyDialog" aria-labelledby="historyHeading"><button class="close" id="closeHistory" aria-label="지난 결과 닫기">×</button><h2 id="historyHeading">지난 결과</h2><div id="historyList"></div></dialog>
<dialog id="koreanSourcesDialog" aria-labelledby="koreanSourcesHeading"><button class="close" id="closeKoreanSources" aria-label="한국어 자료 닫기">×</button><h2 id="koreanSourcesHeading">한국어 자료 찾기</h2><p id="koreanSourcesQuery"></p><div id="koreanSourceLinks"></div><p class="source-search-note">검색처의 원문 검색 화면으로 연결됩니다. KCI에서는 검색어를 입력해주세요.</p><label class="foreign-reading-option"><input id="foreignReadings" type="checkbox">해외 논문도 한국어 번역으로 포함</label></dialog>
<dialog id="mixDialog" aria-labelledby="mixHeading"><button class="close" id="closeMix" aria-label="제작실 닫기">×</button><div id="mixStudio"></div></dialog>
<dialog id="detail"><button class="close" id="closeDetail" aria-label="상세 보기 닫기">×</button><div id="detailBody"></div></dialog>
<dialog id="boardDialog" aria-label="무드보드와 브레인스토밍"><div class="board-toolbar"><button id="closeBoard" aria-label="무드보드 닫기">← 돌아가기</button><button id="addBoardNote">메모 추가 +</button><button id="arrangeBoard">정렬하기</button><button id="connectBoard" aria-pressed="false">화살표 연결 →</button><button id="deleteBoardArrow" disabled>선택 연결 삭제</button><span id="boardStatus" role="status"></span></div><div id="boardViewport"><div id="boardSurface"></div><p id="boardEmpty">아이디어를 모아두면 이곳에 펼쳐집니다.</p></div></dialog><a href="privacy.html" class="privacy-link">개인정보처리방침</a><a href="concepts.html" class="concept-link">시안 비교 ↗</a><a href="connections.html" class="connections-link">연결 현황 ↗</a></body></html>
