<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연결 현황 — Ideation Guy</title><script src="runtime-config.js?v=collector-1"></script><link rel="stylesheet" href="motion.css?v=2"><style>body{font:16px/1.6 system-ui;max-width:880px;margin:48px auto;padding:24px;color:#222;background:#fafafa}h1{font-size:32px}a{color:inherit}button,input{font:inherit;padding:12px;border:1px solid #aaa;background:white}button{cursor:pointer}li{margin:12px 0;padding:16px;background:white;border:1px solid #ddd;list-style:none}ul{padding:0}small{display:block;color:#666}#results{white-space:pre-wrap}nav{display:flex;gap:24px;margin-bottom:30px}#error{color:#9c2424}form{display:flex;gap:8px}input{min-width:0;flex:1}body{color:#eee9df;background:#0c0c0b}li{background:#191917;border-color:#39362f}small{color:#b1a89a}button,input{color:#eee9df;background:#181816;border-color:#5d5140}#error{color:#ffb18a}</style><nav><a href="index.html">← Ideation Guy</a><a href="privacy.html">개인정보처리방침</a></nav><h1>연결 현황</h1><p id="server">서버 상태 확인 중…</p><p id="error" role="status"></p><ul id="providers"></ul><p>공개 자료만 수집합니다. 검색어에 맞는 자료가 없거나 원본 사이트가 응답을 제한하면 결과가 적을 수 있습니다. 나무위키는 <a href="https://namu.wiki/" target="_blank" rel="noopener">원본 사이트</a>에서 확인할 수 있습니다.</p><h2>누적 저장</h2><p id="archive">저장 상태 확인 중…</p><p id="localArchive"></p><h2>실제 검색 응답 확인</h2><form id="test"><input id="query" value="glassmorphism" maxlength="100" aria-label="테스트 검색어"><button id="run">확인하기</button></form><p id="results" role="status"></p><script type="module">
import {createReferenceCache} from './reference-cache.js?v=archive-1';
const local=await createReferenceCache().stats();document.querySelector('#localArchive').textContent='이 브라우저: '+local.queries+'개 키워드 · 이미지 후보 '+local.images+'개';
const base=(window.REFERENCE_API_BASE||'').replace(/\/$/,'');
const get=async path=>{const r=await fetch(base+path,{signal:AbortSignal.timeout(22000)});const d=await r.json();if(!r.ok)throw Error(d.error||'응답 오류');return d;};
try{const d=await get('/api/health');document.querySelector('#server').textContent='수집 서버 정상 작동 · '+new Date(d.checkedAt).toLocaleString('ko-KR');document.querySelector('#archive').textContent=d.archive?.enabled?'공유 저장소: '+d.archive.collections+'개 검색 경로 · 후보 '+d.archive.items+'개':'공유 저장소 미연결 · 이 브라우저의 검색 결과는 저장됩니다.';for(const p of d.providers){const li=document.createElement('li'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=p.provider;small.textContent=p.detail;li.append(strong,small);document.querySelector('#providers').append(li);}}catch(e){document.querySelector('#server').textContent='수집 서버 응답을 받지 못했습니다.';document.querySelector('#error').textContent=e.message;document.querySelector('#archive').textContent='공유 저장소 연결을 확인할 수 없습니다. 이 브라우저의 저장 자료는 재사용할 수 있어요.';}
document.querySelector('#test').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#run'),out=document.querySelector('#results'),q=document.querySelector('#query').value.trim();if(!q)return;button.disabled=true;out.textContent='각 경로에서 실제 검색 응답을 확인하고 있어요…';const rows=await Promise.all([['공개 웹 이미지','/api/images/search'],['Pinterest 공개 페이지','/api/pinterest/public-search'],['Are.na 공개 채널','/api/arena/search'],['Cosmos 공개 검색','/api/cosmos/search'],['디자인 RSS · 박물관','/api/design/search'],['논문 · 기사 · 위키백과','/api/readings/search']].map(async ([name,path])=>{try{const d=await get(path+'?'+new URLSearchParams({q,en:q}));return name+': '+(d.items||d.data||[]).length+'개'+(d.archive?.mode==='stored'?' · 저장 자료':d.archive?.mode==='fresh'?' · 수집 후 누적':'')+((d.diagnostics||[]).some(x=>x.status==='unavailable')?' · 일부 원본 응답 없음':'');}catch(err){return name+': '+err.message;}}));out.textContent=rows.join('\n');button.disabled=false;};
</script></html>
